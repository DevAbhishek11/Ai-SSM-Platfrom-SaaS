apiVersion: v1
kind: ConfigMap
metadata:
  name: ssm-config
  namespace: ssm
data:
  NODE_ENV: production
  API_PORT: "4000"
  WEB_BASE_URL: https://app.example.com
  API_BASE_URL: https://api.example.com/api
  API_HOST: "0.0.0.0"
  CORS_ALLOWED_ORIGINS: https://app.example.com
  NEXT_PUBLIC_API_URL: /api
  API_PROXY_TARGET: http://ssm-api:4000
  API_INTERNAL_URL: http://ssm-api:4000/api
  # AI model routing. Credentials live in the ssm-secrets Secret
  # (OPENAI_API_KEY, ANTHROPIC_API_KEY, OLLAMA_BASE_URL) and are never stored here.
  AI_PROVIDER: auto
  AI_PROVIDER_PRIORITY: ollama,anthropic,openai
  AI_REQUEST_TIMEOUT_MS: "20000"
  AI_MAX_OUTPUT_TOKENS: "900"
  AI_TEMPERATURE: "0.7"
  OLLAMA_MODEL: llama3.1
  ANTHROPIC_MODEL: claude-3-5-sonnet-latest
  ANTHROPIC_VERSION: "2023-06-01"
  OPENAI_MODEL: gpt-4o-mini
